# TEMPLATE · Nginx Proxy Manager su un ALTRO host (o nessun NPM): l'app pubblica una porta HTTP.
#
# Non modificare questo file: ./setup.sh lo copia in docker-compose.yml.
# Il nome dell'istanza (INSTANCE nel .env) distingue più studi sullo stesso server: diventa il
# prefisso di container, immagini e reti (predefinito: studio-odontoiatrico).
#
# Passi:
# 1) ./setup.sh                → scegli "host diverso", crea .env, docker-compose.yml e il primo utente
# 2) Apri la porta HTTP_PORT (predefinita 80) nel firewall, idealmente SOLO verso l'IP del server NPM
# 3) Nel NPM remoto crea due "Proxy Host":
#      gestionale (es. studio.dominio.it):  http / <IP di questo server> / HTTP_PORT
#      conferme   (es. conferma.dominio.it): http / <IP di questo server> / CONFIRM_PORT (predefinita 8180)
#      carte      (es. carte.dominio.it, solo se usi le fidelity card): http / <IP di questo server> / CARD_PORT (predefinita 8200)
#      prenota    (es. prenota.dominio.it, solo se usi le richieste web): http / <IP di questo server> / BOOKING_PORT (predefinita 8220)
#      SSL: certificato Let's Encrypt + "Force SSL"; sul gestionale conviene una Access List
#
# Regole applicate:
# - Solo "app" (Nginx con l'interfaccia) pubblica porte sull'host: HTTP_PORT per il gestionale e
#   CONFIRM_PORT, che risponde solo alla pagina di conferma degli appuntamenti.
# - "booking" (richieste web) sta su reti interne proprie: vede "app" e il database con un utente limitato.
# - "api" e "db" stanno SOLO sulla rete interna "backend" (internal: true), senza porte
#   pubblicate e senza accesso a Internet.

name: ${INSTANCE:-studio-odontoiatrico}

services:
  # Interfaccia web + reverse proxy verso le API. E' il container a cui punta NPM.
  app:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${INSTANCE:-studio-odontoiatrico}-app:latest
    container_name: ${INSTANCE:-studio-odontoiatrico}-app
    restart: unless-stopped
    depends_on:
      - api
      - booking
    ports:
      - "${HTTP_PORT:-80}:80"
      # Solo conferme degli appuntamenti (dominio pubblico dei link): nessun accesso al gestionale.
      - "${CONFIRM_PORT:-8180}:8081"
      # Solo fidelity card (dominio dedicato alle carte): nessun accesso al gestionale.
      - "${CARD_PORT:-8200}:8082"
      # Solo richieste web (dominio dedicato alle richieste): nessun accesso al gestionale.
      - "${BOOKING_PORT:-8220}:8083"
    networks:
      - web
      - backend
      - booking
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Il processo principale di Nginx parte come root e poi passa all'utente "nginx":
    # servono solo questi permessi (la porta 80 interna non richiede NET_BIND_SERVICE).
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 64m
    cpus: 0.5
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # API Node.js: raggiungibile solo da "app" attraverso la rete interna.
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${INSTANCE:-studio-odontoiatrico}-api:latest
    container_name: ${INSTANCE:-studio-odontoiatrico}-api
    restart: unless-stopped
    # Solo le variabili che servono (evita di passare tutto il .env al container).
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}@db:5432/${POSTGRES_DB:-studio}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DATA_KEY: ${DATA_KEY:-}
      TZ: ${TZ:-Europe/Rome}
      # Indirizzo dei link di conferma (es. https://conferma.dominio.it), se diverso dal gestionale.
      CONFIRM_URL: ${CONFIRM_URL:-}
      # Dominio dedicato alle fidelity card (es. https://carte.dominio.it), diverso dal gestionale.
      CARD_BASE_URL: ${CARD_BASE_URL:-}
      # Dominio dedicato alle richieste web (es. https://prenota.dominio.it), diverso dal gestionale.
      BOOKING_BASE_URL: ${BOOKING_BASE_URL:-}
      # Password dell'utente del database usato dal container delle richieste web (solo schema inbox).
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend:
        aliases: [studio-api] # nome usato da Nginx per raggiungere le API
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 224m
    cpus: 1.0
    logging: *logging

  # Richieste web (pagina pubblica del modulo): un container a parte, con una sola password del database
  # che vede solo lo schema "inbox". Non riceve DATA_KEY, SESSION_SECRET né la password principale: se
  # venisse violato non potrebbe leggere pazienti, utenti o agenda. Raggiungibile solo da "app" (porta 8083).
  booking:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${INSTANCE:-studio-odontoiatrico}-api:latest
    container_name: ${INSTANCE:-studio-odontoiatrico}-booking
    restart: unless-stopped
    command: ["node", "src/bookingServer.ts"]
    environment:
      BOOKING_DATABASE_URL: postgres://booking_inbox:${BOOKING_DB_PASSWORD:-}@db:5432/${POSTGRES_DB:-studio}
      BOOKING_SECRET: ${BOOKING_SECRET:-}
      TZ: ${TZ:-Europe/Rome}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    networks:
      booking:
        aliases: [studio-booking] # nome usato da Nginx per raggiungere il modulo
      inbox: {}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

  db:
    image: postgres:16-alpine
    container_name: ${INSTANCE:-studio-odontoiatrico}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      TZ: ${TZ:-Europe/Rome}
    # Parametri ridotti per consumare poca memoria
    command: >
      postgres
      -c shared_buffers=32MB
      -c effective_cache_size=96MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c max_connections=20
      -c wal_buffers=1MB
    volumes:
      - ./db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
      - inbox
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    logging: *logging

networks:
  web:
  backend:
    internal: true
  # Solo "app" e "booking" (richieste web).
  booking:
    internal: true
  # Solo "booking" e "db": il container pubblico vede il database e nient'altro.
  inbox:
    internal: true
