# Stack leggero per istanze piccole (es. OCI Always Free, AMD 1 GB o Ampere ARM).
# Avvio:  ./setup.sh   (oppure: cp .env.example .env  &&  docker compose up -d --build)
# Per il deploy dietro Nginx Proxy Manager usa docker-compose.npm.yml.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      TZ: ${TZ:-Europe/Rome}
    # Parametri ridotti per consumare poca memoria
    command: >
      postgres
      -c shared_buffers=32MB
      -c effective_cache_size=96MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c max_connections=20
      -c wal_buffers=1MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-studio}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      TZ: ${TZ:-Europe/Rome}
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases: [studio-api] # nome usato da Nginx per raggiungere le API
    mem_limit: 224m
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    mem_limit: 64m
    logging: *logging

volumes:
  pgdata:
