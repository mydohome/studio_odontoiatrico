# Limiti per IP del client (quello reale, vedi 00-real-ip.conf: dietro NPM e Cloudflare).
# Accesso: 20 tentativi al minuto con 10 di scorta; il backend applica poi i limiti per nome utente.
limit_req_zone $binary_remote_addr zone=login:1m rate=20r/m;
# Pagina pubblica delle conferme: ampiamente sufficiente per un paziente, frena chi prova codici a raffica.
limit_req_zone $binary_remote_addr zone=public:2m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # App privata e link di conferma personali: niente indicizzazione nei motori di ricerca.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # DNS interno di Docker: il nome del backend viene risolto a ogni richiesta, così
    # Nginx parte anche se il backend non è ancora pronto e segue i cambi di IP
    # quando il container viene ricreato.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://studio-api:3000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # Questa intestazione la imposta solo il server delle conferme qui sotto.
        proxy_set_header X-Public-Gateway "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location = /api/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Public-Gateway "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # File con hash nel nome: cache lunga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# Solo conferme degli appuntamenti (porta 8081), per il dominio pubblico dei link
# (es. conferma.dominio.it). Risponde soltanto la pagina /c/<codice> con le sue risorse,
# le API pubbliche e il logo: niente gestionale, niente login. Tutto il resto è 404.
# ---------------------------------------------------------------------------
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 16k;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://studio-api:3000;

    # Pagina di conferma: stesso codice della pagina dell'app, aperta solo con un codice valido nel formato.
    location ~ "^/c/[A-Za-z0-9_-]{24}/?$" {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    # Dati, conferma e calendario dell'appuntamento.
    location /api/public/ {
        limit_except GET POST { deny all; }
        limit_req zone=public burst=30 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Il backend accetta da qui solo le rotte pubbliche (seconda protezione oltre a Nginx).
        proxy_set_header X-Public-Gateway 1;
        proxy_set_header Cookie "";
        proxy_read_timeout 30s;
    }

    location = /api/logo {
        limit_except GET { deny all; }
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Public-Gateway 1;
        proxy_set_header Cookie "";
        proxy_read_timeout 30s;
    }

    location / {
        default_type text/plain;
        return 404 "Pagina non trovata\n";
    }
}
