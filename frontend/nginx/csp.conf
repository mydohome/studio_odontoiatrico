# Politica di sicurezza dei contenuti per le pagine dell'app (incluso da nginx.conf).
# - script solo dai file dell'app: un testo iniettato in una pagina non può eseguire codice;
# - stili anche «inline» (React e i grafici li usano), immagini anche data:/blob: (QR, logo, PNG delle gift card);
# - font anche data: (html-to-image li incorpora nelle immagini); nessuna richiesta verso altri domini;
# - blob: per i PDF generati nel browser; nessun incorporamento in altri siti (frame-ancestors).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
